<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Profile - LSP</title>
    <link rel="stylesheet" href="/public/style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo-container">
                <h1 class="logo">LSP</h1>
                <img src="https://via.placeholder.com/100x50?text=Service+Man" alt="Service Man" class="header-image">
            </div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/categories">Services</a></li>
                    <li><a href="/providers">Providers</a></li>
                    <li><a href="/costomer-regi">Provider Registration</a></li>
                    <li><a href="/login">Customer Login</a></li>
                    <li id="booking-nav-item" class="hidden"><a href="/booking">Booking</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="register-profile-section">
        <div class="container">
            <h2>Register as a Service Provider</h2>
            <form class="profile-form">
                <div class="form-group">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="service-category">Service Category:</label>
                    <select id="service-category" required>
                        <option value="">Select Category</option>
                        <option value="electricians">Electricians</option>
                        <option value="plumbers">Plumbers</option>
                        <option value="mechanics">Mechanics</option>
                        <option value="welders">Welders</option>
                        <option value="fitters">Fitters</option>
                        <option value="solar">Solar Panel Fitters</option>
                        <option value="computer">Computer Operators</option>
                        <option value="nursing">Nursing Workers</option>
                        <option value="dj">DJ Operators</option>
                        <option value="carpenters">Carpenters</option>
                        <option value="painters">Painters</option>
                        <option value="gardeners">Gardeners</option>
                        <option value="tutors">Tutors</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="experience">Years of Experience:</label>
                    <input type="number" id="experience" min="0" required>
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" placeholder="City, State" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" placeholder="Describe your services and skills"></textarea>
                </div>
                <div class="form-group">
                    <label for="certifications">Certifications (optional):</label>
                    <textarea id="certifications" placeholder="List any relevant certifications"></textarea>
                </div>
                <button type="submit">Register Profile</button>
            </form>
        </div>
    </section>


    <script src="/public/script.js"></script>
</body>

</html>
